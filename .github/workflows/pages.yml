# web/ + data/ + game/ → GitHub Pages
# Settings → Pages → Source: "GitHub Actions" seçilmeli (bir kez, PC1).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # many agents push every minute; a deploy takes ~2 min, so cancelling meant nothing ever went live

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 20

      - name: Quality gate (numbers consistent, no broken links)
        run: |
          python3 -m pip install --quiet pytest numpy pillow
          python3 tools/check_site.py
          python3 -m pytest -q tests/test_numbers_consistency.py tests/test_site_links.py

      - name: Assemble site
        run: |
          set -e
          rm -rf _site
          if [ -f web/package.json ]; then
            (cd web && (npm ci || npm install) && npm run build)
            cp -r web/dist _site
          else
            mkdir -p _site
            cp -r web/. _site/
          fi
          if [ -d data ]; then cp -r data _site/data; fi
          if [ -d game ]; then cp -r game _site/game; fi
          if [ -d web3d ]; then cp -r web3d _site/web3d; fi
          if [ -d docs/story ]; then mkdir -p _site/docs && cp -r docs/story _site/docs/story; fi
          if [ -d docs/bulletins ]; then mkdir -p _site/docs && cp -r docs/bulletins _site/docs/bulletins && cp -r docs/bulletins _site/bulletins; fi
          if [ -d risk ]; then mkdir -p _site/risk && cp risk/*.geojson _site/risk/ 2>/dev/null || true; fi
          if [ -f validation/gnss_stations.csv ]; then mkdir -p _site/validation && cp validation/gnss_stations.csv _site/validation/gnss_stations.csv; fi
          rm -f _site/.gitkeep _site/data/.gitkeep _site/game/.gitkeep
          touch _site/.nojekyll
          echo "Site contents:" && find _site -maxdepth 2 | head -50

      - name: Optimize published images (Pages copy only)
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("_site")
          for p in list(root.glob("data/*/disp/*.png")) + list(root.glob("docs/story/media/*.png")):
              try:
                  with Image.open(p) as im:
                      rgba = im.convert("RGBA")
                      q = rgba.quantize(colors=128, method=Image.Quantize.FASTOCTREE)
                      q.save(p, optimize=True)
              except Exception as exc:
                  print(f"skip {p}: {exc}")
          for p in root.glob("data/*/*.jpg"):
              try:
                  with Image.open(p) as im:
                      im.convert("RGB").save(p, quality=82, optimize=True)
              except Exception as exc:
                  print(f"skip {p}: {exc}")
          PY

      - name: Atlas open-data exports (GeoJSON + CSV)
        run: |
          if [ -f _site/data/global/atlas.json ] && [ ! -f data/global/atlas.geojson ]; then python3 tools/atlas_exports.py _site/data/global/atlas.json; fi

      - name: Cache-bust local JS/CSS (Pages caches files for 10 min)
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          v = os.environ.get("GITHUB_SHA", "dev")[:8]
          pat = re.compile(r'((?:src|href)=")((?!https?:|//|data:|#|mailto:)[^"?#]+\.(?:js|css))(\?[^"#]*)?(")')
          for p in Path("_site").rglob("*.html"):
              t = p.read_text(encoding="utf-8")
              n = pat.sub(lambda m: f"{m.group(1)}{m.group(2)}?v={v}{m.group(4)}", t)
              if n != t:
                  p.write_text(n, encoding="utf-8")
          for p in Path("_site").rglob("*.js"):
              t = p.read_text(encoding="utf-8", errors="ignore")
              n = re.sub(r"import\('\./nisar3d\.js(\?v=[^']*)?'\)", f"import('./nisar3d.js?v={v}')", t)
              if n != t:
                  p.write_text(n, encoding="utf-8")
          print("cache-bust version", v)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

