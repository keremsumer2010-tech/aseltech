name: NISAR Vision Tests

on:
  push:
    paths:
      - "pipeline/nisarpulse/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "pipeline/nisarpulse/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest requests numpy
      - run: python -m pytest pipeline/nisarpulse -q
