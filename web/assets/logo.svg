<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NISAR Pulse">
  <title>NISAR Pulse</title>
  <defs><clipPath id="c"><circle cx="32" cy="32" r="30"/></clipPath></defs>
  <circle cx="32" cy="32" r="30" fill="#0b3d91"/>
  <g clip-path="url(#c)" fill="none" stroke-linecap="round">
    <!-- interferogram fringes over the sinking bowl: one colour cycle = 12.1 cm -->
    <ellipse cx="32" cy="44" rx="24" ry="17" stroke="#3d7bff" stroke-width="2.6" opacity=".9"/>
    <ellipse cx="32" cy="44" rx="17" ry="12" stroke="#22c7bf" stroke-width="2.6"/>
    <ellipse cx="32" cy="44" rx="10.5" ry="7.4" stroke="#f4d34a" stroke-width="2.6"/>
    <!-- ground profile with the subsidence bowl -->
    <path d="M-2 33 H17 C22 33 24 44 32 44 C40 44 42 33 47 33 H66" stroke="#fff" stroke-width="4.2" stroke-linejoin="round"/>
  </g>
  <circle cx="32" cy="44" r="3.6" fill="#ff5a36" stroke="#fff" stroke-width="1.6"/>
  <!-- satellite and radar look direction -->
  <path d="M40.5 17 L35 27" stroke="#fff" stroke-width="1.8" stroke-dasharray="2 2.4" stroke-linecap="round"/>
  <rect x="38.5" y="11" width="9" height="5" rx="1" transform="rotate(-32 43 13.5)" fill="#fff"/>
</svg>
