<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aquifer Run — NISAR Vision</title>
<meta name="description" content="Side-scrolling groundwater platformer based on real NASA-ISRO NISAR subsidence measurements across Tulare Basin, Eloy, Karapinar, and Mexico City.">
<link rel="icon" href="../assets/logo_mark_64.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aquifer Run">
<link rel="apple-touch-icon" href="../assets/logo_mark_192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0f14; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 16 / 9;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    background: #101824;
  }
  .touch-ui {
    display: none;
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
  }
  body.has-touch.in-level .touch-ui { display: block; }
  .t-pause {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom));
    width: 48px; height: 48px; border-radius: 50%; pointer-events: auto;
    border: 2px solid rgba(255,255,255,0.45); background: rgba(15, 23, 34, 0.7);
    color: #fff; font-weight: 800; font-size: 15px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
  }
  .rotate-hint { display: none; }
  @media (orientation: portrait) {
    body.has-touch .rotate-hint {
      display: block; position: fixed; left: 50%; top: max(18px, env(safe-area-inset-top)); transform: translateX(-50%);
      width: min(90vw, 360px); padding: 10px 14px; border-radius: 14px; text-align: center; pointer-events: none; z-index: 20;
      background: rgba(255, 210, 63, 0.95); color: #1c2233; font: 700 15px/1.3 system-ui, -apple-system, sans-serif;
    }
  }
  .t-group {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; gap: 12px; pointer-events: auto;
  }
  .t-left { left: max(16px, env(safe-area-inset-left)); }
  .t-right { right: max(16px, env(safe-area-inset-right)); }
  .t-btn {
    width: 72px; height: 72px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    background: rgba(15, 23, 34, 0.65);
    color: #fff; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .t-btn.active { background: rgba(77, 163, 255, 0.55); border-color: #4da3ff; }
  .t-btn-wide { width: 82px; }
  @media (orientation: landscape) {
    .touch-ui {
      left: 50%; top: 50%; right: auto; bottom: auto;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      transform: translate(-50%, -50%);
    }
  }
  @media (orientation: portrait) {
    /* upright phone: the game is a thin strip in the middle, so the buttons go in the empty space below it */
    .touch-ui { left: 0; right: 0; top: 0; bottom: 0; width: auto; height: auto; transform: none; }
    .t-group { bottom: max(8px, env(safe-area-inset-bottom)); gap: 6px; }
    .t-left { left: max(8px, env(safe-area-inset-left)); }
    .t-right { right: max(8px, env(safe-area-inset-right)); }
    .t-btn { width: clamp(48px, 14vw, 60px); height: clamp(48px, 14vw, 60px); font-size: clamp(11px, 3vw, 14px); }
    .t-btn-wide { width: clamp(60px, 18vw, 72px); }
  }
  @media (max-width: 480px) {
    .t-group { gap: 8px; bottom: max(12px, env(safe-area-inset-bottom)); }
    .t-left { left: max(10px, env(safe-area-inset-left)); }
    .t-right { right: max(10px, env(safe-area-inset-right)); }
    .t-btn { width: 56px; height: 56px; font-size: 12px; }
    .t-btn-wide { width: 68px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas" width="960" height="540" tabindex="0" aria-label="Aquifer Run game: run, jump, switch off pumps and keep the ground from sinking"></canvas>
</div>
<p class="rotate-hint">Turn your phone sideways for a bigger game ↻</p>
<div class="touch-ui" id="touchUi" role="group" aria-label="Touch controls">
  <button type="button" class="t-pause t-btn-pause" data-key="pause" aria-label="Pause">II</button>
  <div class="t-group t-left">
    <button type="button" class="t-btn" data-key="left" aria-label="Move left">◀</button>
    <button type="button" class="t-btn" data-key="right" aria-label="Move right">▶</button>
  </div>
  <div class="t-group t-right">
    <button type="button" class="t-btn t-btn-wide" data-key="action" aria-label="Action">ACTION</button>
    <button type="button" class="t-btn t-btn-wide" data-key="jump" aria-label="Jump">JUMP</button>
  </div>
</div>
<script src="art.js?v=11"></script>
<script src="engine.js?v=11"></script>
<script src="player.js?v=11"></script>
<script src="systems.js?v=11"></script>
<script src="main.js?v=11"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});</script>
</body>
</html>
