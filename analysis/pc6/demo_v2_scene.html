<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NISAR Pulse — 3D Demo v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #070b14; color: #f8fafc; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
    #out { width: 100vw; height: 100vh; object-fit: contain; display: block; }
    #gl { display: none; }
  </style>
</head>
<body>
  <canvas id="gl" width="1920" height="1080"></canvas>
  <canvas id="out" width="1920" height="1080"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
  (async function () {
    const W = 1920, H = 1080, FPS = 30, TOTAL_FRAMES = 900;
    const glCanvas = document.getElementById('gl');
    const outCanvas = document.getElementById('out');
    const ctx = outCanvas.getContext('2d');

    const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.0022);

    const camera = new THREE.PerspectiveCamera(44, W / H, 0.1, 2000);
    const ambient = new THREE.AmbientLight(0xdbeafe, 0.85);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
    dirLight.position.set(60, 110, 75);
    scene.add(dirLight);
    const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.45);
    rimLight.position.set(-70, 40, -60);
    scene.add(rimLight);

    const data = await (await fetch('./demo_v2_data.json')).json();

    function loadTex(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const t = new THREE.Texture(img);
          t.colorSpace = THREE.SRGBColorSpace;
          t.needsUpdate = true;
          resolve(t);
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    // Load all 26 Central Valley full-year textures + 9 Karapinar textures
    const cvTextures = await Promise.all(
      data.cv_fullyear.dates.map((d) => loadTex(`${data.cv_fullyear.disp_dir}/${d}.png`))
    );
    const kpTextures = await Promise.all(
      data.karapinar.dates.map((d) => loadTex(`${data.karapinar.disp_dir}/${d}.png`))
    );

    // Build terrain mesh helper from Copernicus DEM GLO-30
    function buildTerrainGroup(dem, worldW, worldH, elevScale) {
      const group = new THREE.Group();
      const geom = new THREE.PlaneGeometry(worldW, worldH, dem.width - 1, dem.height - 1);
      geom.rotateX(-Math.PI / 2);
      const pos = geom.attributes.position;
      const baseY = new Float32Array(pos.count);
      const colors = new Float32Array(pos.count * 3);
      const span = Math.max(1, dem.max_m - dem.min_m);

      for (let i = 0; i < pos.count; i++) {
        const elev = dem.elev_m[i] ?? dem.min_m;
        const norm = (elev - dem.min_m) / span;
        const y = norm * elevScale;
        pos.setY(i, y);
        baseY[i] = y;
        // Subtle natural terrain shading (valley floor dark slate -> foothills warm stone)
        const c = new THREE.Color().setHSL(0.58 - norm * 0.48, 0.25 + norm * 0.15, 0.18 + norm * 0.34);
        colors[i * 3] = c.r;
        colors[i * 3 + 1] = c.g;
        colors[i * 3 + 2] = c.b;
      }
      geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geom.computeVertexNormals();

      const baseMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.88,
        metalness: 0.05,
      });
      const baseMesh = new THREE.Mesh(geom, baseMat);
      group.add(baseMesh);

      // Overlay plane for NISAR displacement PNG texture (slightly above terrain, breathing with displacement)
      const ovGeom = geom.clone();
      const ovMat = new THREE.MeshStandardMaterial({
        map: null,
        transparent: true,
        opacity: 0.92,
        roughness: 0.65,
        metalness: 0.05,
        depthWrite: false,
      });
      const ovMesh = new THREE.Mesh(ovGeom, ovMat);
      ovMesh.position.y = 0.22;
      group.add(ovMesh);

      return { group, geom, baseY, ovGeom, ovMat, ovMesh };
    }

    // 1. Central Valley 3D terrain
    const cvTerrain = buildTerrainGroup(data.cv_dem, 120, 100, 18);
    scene.add(cvTerrain.group);

    // 2. Karapinar 3D terrain + 29 sinkhole rings
    const kpTerrain = buildTerrainGroup(data.kp_dem, 100, 75, 16);
    const [kw, ks, ke, kn] = data.kp_dem.bbox;
    const sinkRings = new THREE.Group();
    data.karapinar.sinkholes.forEach(([lon, lat]) => {
      const nx = (lon - kw) / (ke - kw) - 0.5;
      const nz = 0.5 - (lat - ks) / (kn - ks);
      const col = Math.min(data.kp_dem.width - 1, Math.max(0, Math.round((lon - kw) / (ke - kw) * (data.kp_dem.width - 1))));
      const row = Math.min(data.kp_dem.height - 1, Math.max(0, Math.round((kn - lat) / (kn - ks) * (data.kp_dem.height - 1))));
      const elev = data.kp_dem.elev_m[row * data.kp_dem.width + col] ?? data.kp_dem.min_m;
      const y = ((elev - data.kp_dem.min_m) / Math.max(1, data.kp_dem.max_m - data.kp_dem.min_m)) * 16 + 0.6;
      const rg = new THREE.RingGeometry(0.9, 1.35, 24);
      rg.rotateX(-Math.PI / 2);
      const rm = new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
      const ring = new THREE.Mesh(rg, rm);
      ring.position.set(nx * 100, y, -nz * 75);
      sinkRings.add(ring);
    });
    kpTerrain.group.add(sinkRings);
    kpTerrain.group.visible = false;
    scene.add(kpTerrain.group);

    // 3. 3D Earth Globe + Atlas Markers
    const globeGroup = new THREE.Group();
    const R = 36;
    const sphereGeom = new THREE.SphereGeometry(R, 64, 48);
    const sphereMat = new THREE.MeshStandardMaterial({
      color: 0x0f2744,
      roughness: 0.75,
      metalness: 0.15,
    });
    globeGroup.add(new THREE.Mesh(sphereGeom, sphereMat));

    // Lat/Lon graticule wireframe
    const wireMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.25 });
    for (let lat = -60; lat <= 60; lat += 30) {
      const phi = (90 - lat) * Math.PI / 180;
      const pts = [];
      for (let lon = 0; lon <= 360; lon += 6) {
        const theta = lon * Math.PI / 180;
        pts.push(new THREE.Vector3(
          -(R + 0.15) * Math.sin(phi) * Math.cos(theta),
          (R + 0.15) * Math.cos(phi),
          (R + 0.15) * Math.sin(phi) * Math.sin(theta)
        ));
      }
      globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
    }
    for (let lon = 0; lon < 360; lon += 30) {
      const theta = lon * Math.PI / 180;
      const pts = [];
      for (let lat = -90; lat <= 90; lat += 6) {
        const phi = (90 - lat) * Math.PI / 180;
        pts.push(new THREE.Vector3(
          -(R + 0.15) * Math.sin(phi) * Math.cos(theta),
          (R + 0.15) * Math.cos(phi),
          (R + 0.15) * Math.sin(phi) * Math.sin(theta)
        ));
      }
      globeGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
    }

    function latLonToVec3(lat, lon, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    const atlasLabels = [];
    data.atlas.forEach((pt) => {
      const pos = latLonToVec3(pt.lat, pt.lon, R + 0.3);
      const mag = Math.min(14, Math.max(2.5, Math.abs(pt.vert_cm) * 0.9));
      const spikeGeom = new THREE.CylinderGeometry(0.45, 0.9, mag, 12);
      spikeGeom.translate(0, mag / 2, 0);
      const isHot = Math.abs(pt.vert_cm) >= 6;
      const spikeMat = new THREE.MeshBasicMaterial({ color: isHot ? 0xef4444 : 0xf59e0b });
      const spike = new THREE.Mesh(spikeGeom, spikeMat);
      spike.position.copy(pos);
      spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), pos.clone().normalize());
      globeGroup.add(spike);
      atlasLabels.push({ pt, tipLocal: latLonToVec3(pt.lat, pt.lon, R + mag + 1.5) });
    });

    globeGroup.visible = false;
    scene.add(globeGroup);

    // Apply vertical breathing to Central Valley floor (west-central basin bowl)
    function applyCvBreathing(losCm) {
      const pos = cvTerrain.ovGeom.attributes.position;
      const basePos = cvTerrain.geom.attributes.position;
      const w = data.cv_dem.width, h = data.cv_dem.height;
      // Exaggerate vertical cm -> world units cleanly so breathing is visible
      const vertScale = (losCm / 0.776) * 0.14;
      for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
          const i = r * w + c;
          const elev = data.cv_dem.elev_m[i] ?? data.cv_dem.min_m;
          // Valley floor mask (elev < 220m)
          const floorMask = Math.max(0, Math.min(1, (220 - elev) / 140));
          // Bowl center near Terra Bella / Tulare Lakebed (c ~ 0.55*w, r ~ 0.60*h)
          const dx = (c / w - 0.55) / 0.25;
          const dz = (r / h - 0.60) / 0.25;
          const bowl = Math.exp(-(dx * dx + dz * dz) * 1.4);
          const dy = vertScale * floorMask * bowl;
          pos.setY(i, cvTerrain.baseY[i] + 0.22 + dy);
          basePos.setY(i, cvTerrain.baseY[i] + dy);
        }
      }
      pos.needsUpdate = true;
      basePos.needsUpdate = true;
    }

    const SUBTITLES = [
      [0, 135, "When groundwater is pumped faster than winter rain refills it, the valley floor sinks."],
      [135, 360, "Across 11 months in California, NISAR tracks winter rebound and up to 26 cm of vertical sinking."],
      [360, 600, "Using one method across the globe, our 2026 NISAR atlas ranks sinking basins from space."],
      [600, 780, "In Konya, Türkiye, farmland within 1 km of 29 mapped sinkholes sank 6.4x faster than background."],
      [780, 900, "NISAR Pulse: Follow the Water — NASA-ISRO NISAR (provisional / mixed) & Copernicus DEM GLO-30."],
    ];

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function drawHUD(frameIdx) {
      ctx.drawImage(glCanvas, 0, 0);

      // Top bar
      ctx.fillStyle = 'rgba(7, 11, 20, 0.78)';
      roundRect(ctx, 44, 34, 670, 88, 14);
      ctx.fill();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 30px Inter, system-ui, sans-serif';
      let sceneTitle = 'Central Valley, California · 11-Month 3D Terrain';
      let badgeText = 'MIXED: BETA-PRECAL + PROVISIONAL';
      let badgeColor = '#f59e0b';
      let metricText = '';

      if (frameIdx < 360) {
        const epIdx = Math.min(data.cv_fullyear.dates.length - 1, Math.floor((frameIdx / 360) * data.cv_fullyear.dates.length));
        const dStr = data.cv_fullyear.dates[epIdx];
        const losCm = data.cv_fullyear.earlimart_los_cm[epIdx] ?? 0;
        const vertEst = (losCm / 0.776).toFixed(1);
        metricText = `Date: ${dStr}   |   Earlimart est. vertical: ${vertEst} cm`;
      } else if (frameIdx < 600) {
        sceneTitle = '2026 NISAR Global Subsidence Atlas (3D Globe)';
        badgeText = 'PROVISIONAL NISAR L2 GUNW';
        badgeColor = '#38bdf8';
        metricText = `${data.atlas.length} measured basins · Same open-source pipeline`;
      } else if (frameIdx < 780) {
        sceneTitle = 'Konya / Karapinar, Türkiye · 29 Mapped Sinkholes';
        badgeText = 'PROVISIONAL · 108 DAYS (2026)';
        badgeColor = '#38bdf8';
        metricText = '0–1 km around sinkholes: −4.15 cm (6.4x background)';
      } else {
        sceneTitle = 'NISAR Pulse — Team Taykut';
        badgeText = 'NO AI VISUALS · REAL SATELLITE DATA';
        badgeColor = '#22c55e';
        metricText = 'keremsumer2010-tech.github.io/aseltech/';
      }

      ctx.fillText(sceneTitle, 68, 76);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '500 22px Inter, system-ui, sans-serif';
      ctx.fillText(metricText, 68, 108);

      // Right badge
      ctx.font = '700 20px Inter, system-ui, sans-serif';
      const bw = ctx.measureText(badgeText).width + 40;
      ctx.fillStyle = 'rgba(7, 11, 20, 0.84)';
      roundRect(ctx, W - bw - 44, 34, bw, 50, 25);
      ctx.fill();
      ctx.strokeStyle = badgeColor;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = badgeColor;
      ctx.fillText(badgeText, W - bw - 24, 66);

      // Globe labels
      if (frameIdx >= 360 && frameIdx < 600) {
        ctx.font = '600 21px Inter, system-ui, sans-serif';
        atlasLabels.forEach(({ pt, tipLocal }) => {
          const worldPos = tipLocal.clone().applyMatrix4(globeGroup.matrixWorld);
          const camDir = worldPos.clone().sub(camera.position).normalize();
          const normal = worldPos.clone().normalize();
          if (camDir.dot(normal) > 0.15) return; // back side of globe
          const p = worldPos.project(camera);
          const sx = (p.x * 0.5 + 0.5) * W;
          const sy = (-p.y * 0.5 + 0.5) * H;
          if (sx < 80 || sx > W - 220 || sy < 130 || sy > H - 150) return;
          const lbl = `${pt.name} (${pt.vert_cm} cm)`;
          const tw = ctx.measureText(lbl).width + 20;
          ctx.fillStyle = 'rgba(7, 11, 20, 0.82)';
          roundRect(ctx, sx + 10, sy - 18, tw, 34, 8);
          ctx.fill();
          ctx.fillStyle = '#f8fafc';
          ctx.fillText(lbl, sx + 20, sy + 6);
        });
      }

      // Closing card overlay
      if (frameIdx >= 780) {
        ctx.fillStyle = 'rgba(7, 11, 20, 0.86)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#38bdf8';
        ctx.font = '700 26px Inter, system-ui, sans-serif';
        ctx.fillText('NASA SPACE APPS CHALLENGE · TEAM TAYKUT', W / 2, 360);
        ctx.fillStyle = '#ffffff';
        ctx.font = '800 76px Inter, system-ui, sans-serif';
        ctx.fillText('NISAR Pulse: Follow the Water', W / 2, 455);
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '500 32px Inter, system-ui, sans-serif';
        ctx.fillText('https://keremsumer2010-tech.github.io/aseltech/', W / 2, 535);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 23px Inter, system-ui, sans-serif';
        ctx.fillText('Data: NASA-ISRO NISAR (provisional / mixed; calibration by NASA-JPL & ISRO) · Copernicus DEM GLO-30 · NGL GNSS · OpenStreetMap', W / 2, 625);
        ctx.textAlign = 'left';
      }

      // Large plain-English subtitle bar at bottom
      const sub = SUBTITLES.find(([a, b]) => frameIdx >= a && frameIdx < b);
      if (sub) {
        const text = sub[2];
        ctx.font = '600 34px Inter, system-ui, sans-serif';
        const sw = Math.min(W - 120, ctx.measureText(text).width + 64);
        const sx = (W - sw) / 2;
        const sy = H - 126;
        ctx.fillStyle = 'rgba(7, 11, 20, 0.88)';
        roundRect(ctx, sx, sy, sw, 78, 14);
        ctx.fill();
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(text, W / 2, sy + 50);
        ctx.textAlign = 'left';
      }
    }

    window.renderFrame = function (frameIdx) {
      if (frameIdx < 360) {
        cvTerrain.group.visible = true;
        globeGroup.visible = false;
        kpTerrain.group.visible = false;
        const u = frameIdx / 360;
        const epIdx = Math.min(cvTextures.length - 1, Math.floor(u * cvTextures.length));
        if (cvTextures[epIdx]) {
          cvTerrain.ovMat.map = cvTextures[epIdx];
          cvTerrain.ovMat.needsUpdate = true;
        }
        applyCvBreathing(data.cv_fullyear.earlimart_los_cm[epIdx] ?? 0);
        const angle = -0.65 + u * 0.95;
        camera.position.set(Math.sin(angle) * 85, 58 - u * 12, Math.cos(angle) * 92);
        camera.lookAt(5, 3, 6);
      } else if (frameIdx < 600) {
        cvTerrain.group.visible = false;
        globeGroup.visible = true;
        kpTerrain.group.visible = false;
        const u = (frameIdx - 360) / 240;
        globeGroup.rotation.y = -2.1 + u * 3.1; // rotates from Americas across Europe/Türkiye to Asia
        camera.position.set(0, 26, 98 - Math.sin(u * Math.PI) * 10);
        camera.lookAt(0, 2, 0);
      } else if (frameIdx < 780) {
        cvTerrain.group.visible = false;
        globeGroup.visible = false;
        kpTerrain.group.visible = true;
        const u = (frameIdx - 600) / 180;
        const epIdx = Math.min(kpTextures.length - 1, Math.floor(u * kpTextures.length));
        if (kpTextures[epIdx]) {
          kpTerrain.ovMat.map = kpTextures[epIdx];
          kpTerrain.ovMat.needsUpdate = true;
        }
        const angle = 0.4 - u * 0.7;
        camera.position.set(Math.sin(angle) * 72, 46 - u * 8, Math.cos(angle) * 74);
        camera.lookAt(0, 3, 0);
      } else {
        cvTerrain.group.visible = false;
        globeGroup.visible = false;
        kpTerrain.group.visible = false;
      }

      renderer.render(scene, camera);
      drawHUD(frameIdx);
    };

    window.__DEMO_READY__ = true;
    window.__TOTAL_FRAMES__ = TOTAL_FRAMES;

    const params = new URLSearchParams(location.search);
    if (params.get('capture') === '1') {
      for (let i = 0; i < TOTAL_FRAMES; i++) {
        window.renderFrame(i);
        const blob = await new Promise((res) => outCanvas.toBlob(res, 'image/png'));
        await fetch(`/frame/${i}`, { method: 'POST', body: blob });
      }
      await fetch('/done', { method: 'POST', body: 'ok' });
    } else {
      let f = 0;
      const tick = () => {
        window.renderFrame(f);
        f = (f + 1) % TOTAL_FRAMES;
        requestAnimationFrame(tick);
      };
      tick();
    }
  })();
  </script>
</body>
</html>
